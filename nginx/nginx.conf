worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream fastapi_backend {
        server app:8000;
    }

    server {
        listen 80 default_server;
        server_name _; # catch-all; терминируем TLS на reverse-proxy/CDN перед ним

        # Frontend — отдаём статику
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # HTML и JS не кэшируем — иначе браузер показывает старую логику
        location ~* \.(html|js)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires off;
        }

        # Backend API — проксируем на FastAPI.
        # Trailing slash на proxy_pass обязателен: nginx срежет префикс /api/
        # и FastAPI получит путь вида /products/ (а не /api/products/).
        location /api/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Статические файлы FastAPI (изображения товаров и т.д.) — отдаём напрямую с диска
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Sqladmin панель
        location /admin {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}