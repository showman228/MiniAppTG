[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miniapptg-fastapi-server"
version = "0.1.0"  # <-- ОБЯЗАТЕЛЬНО: добавьте эту строку
description = "FastAPI server for Telegram Mini App"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools]
packages = ["app"] # укажите вашу основную папку с кодом