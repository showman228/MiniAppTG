<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оформление заказа - Le désir d'être</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css"/>
</head>
<body class="shop-body">

  <div id="header-slot"></div>

  <main class="page-section container">
    <h1 class="page-title">Оформление заказа</h1>

    <section class="checkout-grid">

      <!-- Форма покупателя -->
      <form class="card form-card" id="checkout-form">
        <div class="form-grid">
          <input class="input" name="name"    required placeholder="Имя и фамилия"/>
          <input class="input" name="email"   required type="email" placeholder="Email"/>
          <input class="input" name="address" required placeholder="Адрес доставки"/>
          <input class="input" name="city"    required placeholder="Город"/>
          <input class="input" name="zip"     required placeholder="Почтовый индекс"/>
          <button class="btn btn-primary" type="submit">Оформить заказ</button>
        </div>
      </form>

      <!-- Состав заказа — вставляется через checkout.js -->
      <aside class="card summary-card">
        <h2>Состав заказа</h2>
        <ul class="summary-list" id="checkout-list"></ul>
        <p class="total-line">Итого: <span id="checkout-total">0 ₽</span></p>
      </aside>

    </section>
  </main>

  <footer class="footer">
    <p>© Le désir d'être 2026</p>
  </footer>

  <script type="module" src="js/pages/checkout.js"></script>
</body>
</html>
